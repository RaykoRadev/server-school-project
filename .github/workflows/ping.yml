name: Keep the Server Warm

on:
    schedule:
        # Mon–Fri: 13:00–22:55 (every 14 minutes)
        - cron: "*/14 13-22 * * 1-5"

        # Sat–Sun: 08:00–22:55 (every 14 minutes)
        - cron: "*/14 8-22 * * 6,0"

jobs:
    ping:
        runs-on: ubuntu-latest
        steps:
            - name: Ping Railway Server
              run: |
                  curl -m 10 -s https://server-school-project.onrender.com/health > /dev/null || true
